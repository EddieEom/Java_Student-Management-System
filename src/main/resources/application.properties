spring.application.name=backendintro

# The project targets Microsoft SQL Server. Supply credentials through environment variables.
# Never commit real usernames or passwords to the repository.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BackendIntroDB;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
