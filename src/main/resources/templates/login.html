<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>학생관리 시스템 로그인</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
                place-items: center;
                background: #f5f7fb;
                color: #192744;
                font: 16px/1.6 "Malgun Gothic", system-ui, sans-serif;
            }

            main {
                width: min(100%, 26rem);
                padding: clamp(24px, 6vw, 40px);
                border: 1px solid #e1e6ef;
                border-radius: 16px;
                background: white;
            }

            h1 {
                margin: 0;
                font-size: 1.65rem;
            }

            label {
                display: block;
                margin: 16px 0 4px;
                font-weight: 600;
            }

            input,
            button {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #aab4c5;
                border-radius: 8px;
                font: inherit;
            }

            button {
                margin-top: 24px;
                border: 0;
                background: #294cc5;
                color: white;
                cursor: pointer;
            }

            .error {
                color: #a32626;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>학생관리 시스템</h1>
            <p>서비스를 이용하려면 로그인해 주세요.</p>
            <form th:action="@{/login}" method="post">
                <label for="username">아이디</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus
                />
                <label for="password">비밀번호</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                />
                <button type="submit">로그인</button>
            </form>
            <p class="error" th:if="${param.error}" role="alert">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </p>
        </main>
    </body>
</html>
